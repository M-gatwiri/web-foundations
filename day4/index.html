<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>
        <p class="subtitle">Write your thoughts and save them as a draft.</p>
    <label for="note-text">Your Note</label>
    <textarea
        id="note-text"
        placeholder="Start typing your note here..."
        maxlength="200"
        rows="10"
    ></textarea>

    <div class="counters">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
    </div>

    <div class="buttons">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
    </div>
</main>

</body>
</html>
